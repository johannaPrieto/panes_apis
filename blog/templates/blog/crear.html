{% load static %}
<!DOCTYPE html>
<html>
<head>
   <title>Nueva Receta</title>
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navbar removed for this page to keep a clean form view -->

    <main style="padding:140px 7% 60px; display:flex; justify-content:center;">
        <section class="form-card">
            <h1>{% if edit_mode %}Editar receta{% else %}Crear nueva receta{% endif %}</h1>

            {% if error %}
                <div class="form-error">{{ error }}</div>
            {% endif %}

            <form method="post" enctype="multipart/form-data" class="recipe-form" action="{% if edit_mode %}{% url 'editar_recipe' recipe.id %}{% else %}{% url 'crear_recipe' %}{% endif %}">
                {% csrf_token %}

                <label class="form-label">Título</label>
                <input class="form-input" type="text" name="titulo" placeholder="Ej: Enchiladas Oaxaqueñas" value="{{ recipe.titulo|default:'' }}" required>

                <label class="form-label">Descripción</label>
                <textarea class="form-textarea" name="descripcion" rows="3" placeholder="Describe brevemente tu receta..." required>{{ recipe.descripcion|default:'' }}</textarea>

                <label class="form-label">Ingredientes</label>
                <textarea class="form-textarea" name="ingredientes" rows="4" placeholder="Lista los ingredientes separados por líneas..." required>{{ recipe.ingredientes|default:'' }}</textarea>

                <label class="form-label">Instrucciones</label>
                <textarea class="form-textarea" name="instrucciones" rows="6" placeholder="Paso 1: ...\nPaso 2: ..." required>{{ recipe.instrucciones|default:'' }}</textarea>

                <div class="form-row">
                    <div class="form-col">
                        <label class="form-label">Tipo</label>
                        <select class="form-select" name="tipo" required>
                            <option value="dulce" {% if recipe.tipo == 'dulce' %}selected{% endif %}>Dulce</option>
                            <option value="salado" {% if recipe.tipo == 'salado' %}selected{% endif %}>Salado</option>
                        </select>
                    </div>

                    <div class="form-col">
                        <label class="form-label">Categoría</label>
                        <select class="form-select" name="categoria">
                            <option value="" {% if not recipe.categoria %}selected{% endif %}>Sin categoría</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if recipe.categoria and recipe.categoria.id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <label class="form-label">Zona</label>
                <input class="form-input" type="text" name="zona" placeholder="Ej: Ciudad de México, Oaxaca" value="{{ recipe.zona|default:'' }}" required>

                <label class="form-label">Imagen</label>
                <div class="file-row">
                    <input class="file-input" type="file" name="imagen" accept="image/*">
                    <button type="submit" class="btn-primary save-btn">{% if edit_mode %}Actualizar{% else %}Guardar{% endif %}</button>
                </div>

                <p class="muted"><a href="{% url 'publicaciones' %}">← Volver a las recetas</a></p>
            </form>
        </section>
    </main>

</body>
</html>
