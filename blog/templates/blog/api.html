{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>json Api</title>
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
</head>
<body>
    <h1>Datos combinados</h1>

    <div id="posts"></div>

    <script>
    async function cargarDatos() {
        try {
            // API propia
            const resRecipes = await fetch('/api/recipes/');
            const recipes = await resRecipes.json();

            // API externa
            const resUsers = await fetch('https://jsonplaceholder.typicode.com/users');
            const users = await resUsers.json();

            // Combinar datos
            let html = '';
            recipes.forEach((recipe, i) => {
                const user = users[i % users.length]; // mezcla simple
                html += `
                    <div style="margin-bottom:20px;">
                        <h2>${recipe.titulo}</h2>
                        <p><strong>Descripción:</strong> ${recipe.descripcion}</p>
                        <p><strong>Ingredientes:</strong> ${recipe.ingredientes}</p>
                        <p><strong>Instrucciones:</strong> ${recipe.instrucciones}</p>
                        <p><strong>Tipo:</strong> ${recipe.tipo}</p>
                        <p><strong>Categoría:</strong> ${recipe.categoria__name || 'Sin categoría'}</p>
                        <small>Autor local: ${recipe.autor__username} | Usuario externo: ${user.name}</small>
                        <hr>
                    </div>
                `;
            });

            document.getElementById('posts').innerHTML = html;
        } catch (error) {
            console.error('Error cargando datos:', error);
            document.getElementById('posts').innerHTML = '<p>Error al cargar los datos.</p>';
        }
    }

    cargarDatos(); // Llamada inicial
    setInterval(cargarDatos, 10000);
    </script>
</body>
</html>
